newQuestionPlan();for(let i=0;i<TASK_COUNT;i++){let st={z:-70-i*STATION_GAP,group:null,cubes:[]};resetStation(st,i);stations.push(st)}

function buildStation(st){const group=new T.Group();group.position.z=st.z;scene.add(group);st.group=group;let board=rb(7.3,1.15,.32,'#2942BB',0,5.75,6,group);let face=mesh(new T.PlaneGeometry(6.95,.87),new T.MeshBasicMaterial({map:textTex(st.q.text+' = ?','#ffffff','#2942BB',512,128,700)}),0,5.75,6.19,group);for(let x of [-5.15,5.15]){rb(.2,6.6,.2,'#3d7076',x,3.3,6,group);rb(.55,.7,.6,'#e9c785',x,.4,6,group)}rb(10.5,.22,.28,'#3D95F7',0,6.6,6,group);
mergeStatic(group);
for(let i=0;i<3;i++){let holder=new T.Group();holder.position.set(LANES[i],1.15,st.offsets[i]);group.add(holder);let box=mesh(cubeGeo,mat('#2942BB',.36),0,0,0,holder);let numbermap=textTex(''+st.values[i],'#ffffff','#2942BB',256,256,700);let numbermat=new T.MeshBasicMaterial({map:numbermap});for(let j=0;j<4;j++){let f=mesh(new T.PlaneGeometry(1.15,1.15),numbermat,Math.sin(j*Math.PI/2)*.77,0,Math.cos(j*Math.PI/2)*.77,box);f.rotation.y=j*Math.PI/2}mergeStatic(box);st.cubes.push({holder,box})}return st}

let particles=[];const pgeo=new T.OctahedronGeometry(.12);const particlePool=new T.InstancedMesh(pgeo,mat('#ffffff').clone(),100);particlePool.instanceColor=new T.InstancedBufferAttribute(new Float32Array(100*3).fill(1),3);particlePool.instanceColor.setUsage(T.DynamicDrawUsage);particlePool.instanceMatrix.setUsage(T.DynamicDrawUsage);scene.add(particlePool);particlePool.count=0;function burst(x,y,z,good){for(let i=0;i<36;i++)particles.push({x,y,z,vx:rand(-3,3),vy:rand(2,6),vz:rand(-3,3),life:1,color:new T.Color(good?(i%2?'#52B36C':'#ED8B00'):'#ED625D')})}
let failureTime=0,smokeClock=0;const smoke=[];const smokePool=new T.InstancedMesh(new T.SphereGeometry(1,8,6),new T.MeshStandardMaterial({color:'#8b9198',transparent:true,opacity:.34,depthWrite:false,roughness:1}),28);smokePool.count=0;smokePool.frustumCulled=false;smokePool.instanceMatrix.setUsage(T.DynamicDrawUsage);scene.add(smokePool);
function breakdown(){S.mode='broken';$('tapzones').hidden=true;S.failed=true;S.speed=0;S.lateralVelocity=0;S.hit=.35;failureTime=0;smokeClock=.2;chassis.rotation.x=.09;chassis.rotation.z=.035}
function updateSmoke(dt){if(!S.failed){smokePool.count=0;return}smokeClock+=dt;if(smokeClock>.12&&smoke.length<28){smokeClock=0;smoke.push({x:rover.position.x+rand(-.12,.12),y:1,z:rover.position.z+.55,age:0,drift:rand(-.12,.12)})}for(let i=smoke.length-1;i>=0;i--){let p=smoke[i];p.age+=dt;p.y+=dt*.65;p.x+=dt*(.13+p.drift);if(p.age>3.1)smoke.splice(i,1)}smokePool.count=smoke.length;smoke.forEach((p,i)=>{temp.position.set(p.x,p.y,p.z);temp.rotation.set(p.age*.2,0,p.age*.4);let size=(.14+p.age*.14)*Math.min(1,(3.1-p.age)*2);temp.scale.set(size,size*.85,size);temp.updateMatrix();smokePool.setMatrixAt(i,temp.matrix)});smokePool.instanceMatrix.needsUpdate=true}
let S={mode:'intro',lane:1,z:0,speed:16,score:0,correct:0,combo:0,hit:0,time:0,lateralVelocity:0,errors:0,failed:false},sound=true,audioCtx,audioBus,motorGain,motorFilter,motorOsc,motorToneGain,turnOsc,turnGain;let nextBird=0;let finishTime=0;
const music=new Audio('https://plairpro.github.io/rover/dist/assets/rover-music.mp3');music.loop=true;music.preload='auto';music.volume=.10;function musicMayPlay(){return S.mode==='play'||(!S.failed&&(S.mode==='finish'||S.mode==='result'))}function syncMusic(){if(sound&&!document.hidden&&musicMayPlay()&&!music.ended){music.play().catch(()=>{})}else music.pause()}
function ensureAudio(){try{if(!audioCtx){audioCtx=new(window.AudioContext||window.webkitAudioContext)();audioBus=audioCtx.createGain();audioBus.gain.value=sound?.84:0;audioBus.connect(audioCtx.destination);
const noise=audioCtx.createBuffer(1,audioCtx.sampleRate*5,audioCtx.sampleRate);let samples=noise.getChannelData(0),brown=0;for(let i=0;i<samples.length;i++){brown=(brown+Math.random()*.04-.02)/1.02;samples[i]=brown*4}

// Distant traffic and a soft breeze, with slowly varying intensity.
let city=noiseLayer('lowpass',550,.11);let breeze=noiseLayer('highpass',900,.035);let trafficLfo=audioCtx.createOscillator(),trafficDepth=audioCtx.createGain();trafficLfo.frequency.value=.065;trafficDepth.gain.value=.025;trafficLfo.connect(trafficDepth);trafficDepth.connect(city.gain.gain);trafficLfo.start();
let motor=noiseLayer('bandpass',550,0);motorGain=motor.gain;motorFilter=motor.filter;motorOsc=audioCtx.createOscillator();motorOsc.type='sine';motorOsc.frequency.value=100;motorToneGain=audioCtx.createGain();motorToneGain.gain.value=0;motorOsc.connect(motorToneGain);motorToneGain.connect(audioBus);motorOsc.start();turnOsc=audioCtx.createOscillator();turnOsc.type='sine';turnOsc.frequency.value=190;turnGain=audioCtx.createGain();turnGain.gain.value=0;turnOsc.connect(turnGain);turnGain.connect(audioBus);turnOsc.start();nextBird=audioCtx.currentTime+1.5}

function updateAudio(){if(!musicMayPlay()&&!music.paused)music.pause();if(!audioCtx||audioCtx.state!=='running')return;let time=audioCtx.currentTime,moving=S.mode==='play',v=moving?Math.min(1.2,S.speed/28.8):0;motorGain.gain.setTargetAtTime(v? .065+v*.045:0,time,.18);motorFilter.frequency.setTargetAtTime(350+v*650,time,.2);motorOsc.frequency.setTargetAtTime(70+v*65,time,.2);motorToneGain.gain.setTargetAtTime(v*.018,time,.18);let turning=moving?Math.min(1,Math.abs(S.lateralVelocity)/5):0;turnOsc.frequency.setTargetAtTime(180+turning*160,time,.09);turnGain.gain.setTargetAtTime(turning*.035,time,.08);if(sound&&time>=nextBird){birdSong();nextBird=time+rand(5,10)}}
function beep(good){if(!sound)return;ensureAudio();if(!audioCtx)return;try{const now=audioCtx.currentTime;let notes=good?[523.25,659.25,783.99]:[155];notes.forEach((hz,i)=>{let at=now+i*.055,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=good?'sine':'triangle';o.frequency.setValueAtTime(hz,at);if(!good)o.frequency.exponentialRampToValueAtTime(70,at+.24);g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(good?.19:.23,at+.012);g.gain.exponentialRampToValueAtTime(.0001,at+(good?.4:.3));o.connect(g);g.connect(audioBus);o.onended=()=>{o.disconnect();g.disconnect()};o.start(at);o.stop(at+.44)})}catch(e){}}

function updateLives(){for(let i=0;i<3;i++)$('life'+i).className=i<3-S.errors?'':'lost';$('lives').setAttribute('aria-label','Осталось попыток: '+(3-S.errors))}
function start(){music.pause();music.loop=true;try{music.currentTime=0}catch(e){}S={mode:'play',lane:1,z:0,speed:16,score:0,correct:0,combo:0,hit:0,time:0,lateralVelocity:0,errors:0,failed:false};syncMusic();if(sound)ensureAudio();active=-1;failureTime=0;smoke.length=0;smokePool.count=0;particles.length=0;updateLives();rover.position.set(0,0,0);rover.rotation.y=0;newQuestionPlan();stations.forEach((st,i)=>{disposeStation(st);resetStation(st,i)});['intro','introbrand','startbox','result'].forEach(id=>$(id).hidden=true);$('lives').hidden=false;$('tapzones').hidden=false;syncMusic();}
function move(dir){if(S.mode==='play')S.lane=Math.max(0,Math.min(2,S.lane+dir))}
$('start').onclick=start;$('again').onclick=start;$('sound').onclick=()=>{sound=!sound;ensureAudio();syncMusic();$('sound').textContent=sound?'♫':'♪';$('sound').setAttribute('aria-label',sound?'Выключить звук':'Включить звук');beep(true)};
addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','a','A','d','D',' '].includes(e.key))e.preventDefault();if(['ArrowLeft','a','A'].includes(e.key))move(-1);if(['ArrowRight','d','D'].includes(e.key))move(1);if(e.key===' '&&S.mode!=='play')start()});for(const [id,dir] of [['tapleft',-1],['tapright',1]]){let button=$(id);button.addEventListener('pointerdown',e=>{if(e.isPrimary===false||e.button>0)return;e.preventDefault();move(dir)},{passive:false});button.addEventListener('click',e=>{if(e.detail===0)move(dir)})}

function finish(){S.mode='finish';music.loop=false;syncMusic();$('tapzones').hidden=true;$('lives').hidden=true;finishTime=0;burst(rover.position.x,2,S.z,true);}
function result(){S.mode='result';$('resulticon').innerHTML=S.failed?'<img src="https://plairpro.github.io/rover/pochtatech/assets/result-fail.webp" alt="Кот расстроен">':'<img src="https://plairpro.github.io/rover/pochtatech/assets/result-win.webp" alt="Кот с кубком">';$('lives').hidden=true;$('resulttitle').textContent=S.failed?'Ровер не доехал':'Доставлено!';$('resulttitle').hidden=false;$('resulticon').hidden=false;let best=0;try{best=Number(localStorage.getItem('pochtatech-best')||0);if(S.score>best){best=S.score;localStorage.setItem('pochtatech-best',''+best)}}catch(e){}$('total').textContent=S.score+' баллов';$('summary').innerHTML=S.failed?'Верных ответов: '+S.correct:'Верных ответов: <strong>'+S.correct+'</strong> из <strong>'+TASK_COUNT+'</strong><br>Лучший результат: '+best;$('result').hidden=false}
function rollWheels(distance){if(distance<=0)return;const angle=distance/(.36*rover.scale.x);for(let w of wheels)w.rotation.x=(w.rotation.x-angle)%(Math.PI*2)}
let last=performance.now(),t=0;const vec=new T.Vector3();function tick(now){let dt=Math.min((now-last)/1000,.04);last=now;t+=dt;S.time+=dt;S.hit=Math.max(0,S.hit-dt);const wasDriving=S.mode==='play',wheelStartX=rover.position.x,wheelStartZ=rover.position.z;
if(S.mode==='play'){let target=16+S.correct*.8;S.speed+=(target-S.speed)*(1-Math.exp(-dt*1.2));S.z-=S.speed*dt;if(S.z<=FINISH_Z+6){S.z=FINISH_Z+6;finish()}rover.position.z=S.z;let dx=LANES[S.lane]-rover.position.x,acceleration=dx*24-S.lateralVelocity*9;S.lateralVelocity+=acceleration*dt;rover.position.x+=S.lateralVelocity*dt;let heading=-Math.atan2(S.lateralVelocity,Math.max(S.speed,8));rover.rotation.y+=(heading-rover.rotation.y)*(1-Math.exp(-dt*9));chassis.rotation.z+=(-acceleration*.004-chassis.rotation.z)*(1-Math.exp(-dt*7));chassis.rotation.x=Math.sin(t*9)*.012;for(let wheel of wheels){let steering=wheel.userData.front?Math.max(-.42,Math.min(.42,-dx*.17+S.lateralVelocity*.022)):0;wheel.userData.steering.rotation.y+=(steering-wheel.userData.steering.rotation.y)*(1-Math.exp(-dt*12))}let next=stations.findIndex(st=>!st.done);if(next!==active&&next>=0){active=next;}
for(let st of stations){if(S.mode!=='play')break;if(st.z<S.z+44&&st.z>S.z-80&&!st.group)buildStation(st);if(st.group&&st.z>S.z+44)disposeStation(st);if(st.done)continue;
for(let i=0;i<3;i++){let cubeZ=st.z+st.offsets[i];if(st.passed[i]||S.z>cubeZ+.9)continue;st.passed[i]=true;if(Math.abs(rover.position.x-LANES[i])>=1.45)continue;let good=st.values[i]===st.q.value;
if(good){st.collected=true;S.correct++;S.combo++;S.score+=100+Math.min(5,S.combo-1)*20;burst(rover.position.x,1.5,cubeZ,true)}else{st.wrong=true;S.errors++;updateLives();S.combo=0;S.speed=8;S.hit=.55;burst(rover.position.x,1.3,cubeZ,false)}beep(good);if(st.cubes[i]){let cube=st.cubes[i];if(good){cube.pickup=.5;cube.box.material=mat('#52B36C',.35);cube.box.material.emissive.set('#245E35');cube.box.children.forEach(face=>face.material.color.set('#ffffff'))}else cube.holder.visible=false;}if(S.errors>=3){breakdown();break}}
if(st.passed.every(Boolean)){st.done=true;if(!st.collected){S.combo=0;}}}

}else if(S.mode==='broken'){failureTime+=dt;if(failureTime>1.8)result()}else if(S.mode==='finish'){rover.rotation.y*=Math.exp(-dt*5);for(let wheel of wheels)wheel.userData.steering.rotation.y*=Math.exp(-dt*6);finishTime+=dt;if(finishTime>2.6)result()}
if(S.mode==='intro'){rover.position.set(0,0,-12);chassis.rotation.z=Math.sin(t*1.5)*.025;camera.position.set(7.7,5.4,rover.position.z+10.8);camera.lookAt(0,1.5,rover.position.z-8)}else if(S.mode==='play'){camera.position.set(rover.position.x*.5+(S.hit?Math.sin(t*90)*S.hit*.12:0),4.7,S.z+10.5);camera.lookAt(rover.position.x*.3,1.5,S.z-18)}else if(S.failed){camera.position.lerp(new T.Vector3(rover.position.x+4,4.5,S.z+8.5),dt*2);camera.lookAt(rover.position.x,1.1,S.z)}else{let a=Math.min(finishTime/2.3,1);a=a*a*(3-2*a);camera.position.lerp(new T.Vector3(-2,10,S.z+17),dt*2);camera.lookAt(7,1.5+a*7.5,S.z-18-a*50)}
chassis.position.y=S.failed?-.07:Math.sin(t*(S.mode==='play'?12:3))*.024-(S.hit?Math.abs(Math.sin(t*40))*.08:0);if(wasDriving)rollWheels(Math.hypot(rover.position.x-wheelStartX,rover.position.z-wheelStartZ));rear.forEach(o=>o.material.emissive.set(S.hit?'#ED625D':'#000000'));flag.rotation.z=Math.sin(t*6)*.08;rs.position.set(rover.position.x,.08,rover.position.z);sky.position.copy(camera.position);clouds.position.z=camera.position.z*.8;
for(let st of stations)if(st.group){st.cubes.forEach((c,i)=>{if(c.pickup>0){c.pickup=Math.max(0,c.pickup-dt);let fraction=c.pickup/.5;c.holder.position.y=1.15+(1-fraction)*1.4;c.holder.scale.setScalar(.25+fraction*.75);c.box.rotation.y+=dt*3;if(c.pickup===0)c.holder.visible=false}else{c.holder.position.y=1.15+Math.sin(t*2+i)*.07;c.box.rotation.y=Math.sin(t*.7)*.13}})}
particles=particles.filter(p=>p.life>0).slice(-100);particlePool.count=particles.length;particles.forEach((p,i)=>{p.life-=dt;p.vy-=dt*9;p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;temp.position.set(p.x,p.y,p.z);temp.rotation.set(t*3+i,t*4,0);temp.scale.setScalar(Math.max(0,p.life));temp.updateMatrix();particlePool.setMatrixAt(i,temp.matrix);particlePool.setColorAt(i,p.color)});particlePool.instanceMatrix.needsUpdate=true;if(particlePool.instanceColor)particlePool.instanceColor.needsUpdate=true;victoryRays.visible=!S.failed&&Math.abs(S.z-FINISH_Z)<230;victoryRays.rotation.z=Math.sin(t*.45)*.025;victoryRays.scale.setScalar(1+Math.sin(t*.9)*.025);rayMaterial.opacity=.36+Math.sin(t*1.4)*.05;updateSmoke(dt);updateAudio();cullWorld(rover.position.z);renderer.render(scene,camera);requestAnimationFrame(tick)}
document.addEventListener('visibilitychange',()=>{syncMusic();if(!audioCtx)return;if(document.hidden)audioCtx.suspend().catch(()=>{});else if(sound)audioCtx.resume().catch(()=>{})});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});$('loading').hidden=true;window.roverDiagnostics=()=>({state:{...S},render:{...renderer.info.render},memory:{...renderer.info.memory},stations:stations.map(s=>({done:s.done,z:s.z,question:s.q.text,correct:s.q.value,values:s.values,cubeZ:s.offsets.map(o=>s.z+o),passed:s.passed,collected:s.collected}))});
if(document.modelContext?.registerTool){try{Promise.resolve(document.modelContext.registerTool({name:'read_rover_run',description:'Read current score and progress in the visible rover game.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true},execute:()=>({mode:S.mode,score:S.score,correct:S.correct,total:TASK_COUNT})})).catch(()=>{})}catch(e){}}
